name: Source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install portable test dependencies
        run: python -m pip install PyMuPDF==2.0 Pillow==13.0.0
      - name: Frontend compile
        run: |
          npm --prefix desktop/web ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop/web run build
          exit $LASTEXITCODE
      - name: Python contracts and UTF-8
        run: |
          python -I -X utf8 scripts/test_workflow.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -X utf8 scripts/test_reader.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -X utf8 scripts/test_recovery.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -X utf8 scripts/test_desktop.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -X utf8 scripts/check_source.py
          exit $LASTEXITCODE
      - name: Signing metadata contracts
        run: pwsh -NoProfile -NonInteractive -File scripts/test-signing.ps1
      - name: Rust format and unit contracts
        run: |
          rustup update stable --no-self-update
          cargo fmt --manifest-path desktop/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -j 2 -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop/Cargo.toml -j 2
          exit $LASTEXITCODE
