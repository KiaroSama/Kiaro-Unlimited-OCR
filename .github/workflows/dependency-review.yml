name: Dependency review
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Existing comparison commit/ref'
        required: true
      head_ref:
        description: 'Completed commit/ref to review'
        required: true
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
