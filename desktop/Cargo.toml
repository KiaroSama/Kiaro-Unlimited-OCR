[package]
name = "kiaro-unlimited-ocr"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["KiaroSama <Kiaro.Sama.Dev@gmail.com>"]
description = "Local CUDA document workspace"

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = "=0.4.45"
rfd = "=0.17.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
lto = false
codegen-units = 16
strip = true
